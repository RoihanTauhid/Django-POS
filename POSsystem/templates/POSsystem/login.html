{% load static %}
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masuk | CoreRetail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="flex min-h-screen items-center justify-center bg-[#f6f5f0] p-5 font-sans text-[#20231f]"
  >
    <main
      class="w-full max-w-md rounded-3xl border border-[#e5e5dc] bg-[#fbfbf8] p-7 shadow-xl sm:p-10"
    >
      <div class="mb-10 flex items-center gap-3">
        <img src="{% static 'POSsystem/images/logo.jpg' %}" alt="CoreRetail" class="h-10 w-10 rounded-xl object-cover border border-[#e5e5dc]" />
        <span class="text-lg font-extrabold">CoreRetail<span class="text-[#879b75]">.</span></span>
      </div>
      <p
        class="mb-2 text-xs font-bold uppercase tracking-[.16em] text-[#879b75]"
      >
        Point of sale
      </p>
      <h1 class="text-3xl font-extrabold">Selamat datang kembali.</h1>
      <p class="mt-2 text-sm text-[#747a71]">
        Masuk untuk mengelola operasional toko.
      </p>
      {% if messages %}
      <div class="mt-5 space-y-2">
        {% for message in messages %}
        <div
          class="rounded-xl bg-[#fff4ed] px-4 py-3 text-xs font-semibold text-[#9c5f3b]"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
      <form method="POST" class="mt-8 space-y-4">
        {% csrf_token %}<label class="block text-xs font-bold"
          >Username<input
            name="username"
            required
            autofocus
            class="mt-2 w-full rounded-xl border border-[#e5e5dc] bg-[#f6f6f1] p-3.5 text-sm outline-none focus:border-[#879b75]" /></label
        ><label class="block text-xs font-bold"
          >Password<input
            type="password"
            name="password"
            required
            class="mt-2 w-full rounded-xl border border-[#e5e5dc] bg-[#f6f6f1] p-3.5 text-sm outline-none focus:border-[#879b75]" /></label
        ><button
          class="mt-3 w-full rounded-xl bg-[#20231f] py-3.5 text-xs font-extrabold text-white hover:bg-[#607251]"
        >
          Masuk ke dashboard
        </button>
      </form>
    </main>
  </body>
</html>
